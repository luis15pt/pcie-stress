# Drop-in for whichever unit runs psu_exporter.py.
# NOTE: the unit is named psu-monitor.service on Juno but psu-exporter.service
# on Zhen. Install under the matching <unit>.service.d/ directory.
#
# ~60 short-lived ipmitool spawns per scrape is fork/exec-heavy and therefore
# CPU-bound. Juno's unit shipped CPUQuota=10% (100ms of CPU per second), which
# stretched a scrape to ~30s - past Prometheus' scrape timeout - so Juno's PSU
# metrics silently vanished from Grafana. That was precisely the data needed to
# diagnose the 2026-09-06 PSU shutdowns. Zhen, with no quota, did identical
# work in ~4s.
[Service]
CPUQuota=50%
