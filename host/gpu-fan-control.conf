# /etc/gpu-fan-control.conf — sourced by gpu-fan-control.sh
# Curve: MIN_DUTY below T_LOW, linear to MAX_DUTY at T_HIGH, EMERG_DUTY at T_EMERG.

#MIN_DUTY=20      # quiet floor (your current manual setting)
#MAX_DUTY=50      # normal ceiling, reached at T_HIGH
#T_LOW=70         # degC where the curve starts rising
#T_HIGH=85        # degC where fans hit MAX_DUTY (just before sw throttle ~90)
#T_EMERG=92       # degC safety override...
#EMERG_DUTY=100   # ...to this duty (protects hardware; set =MAX_DUTY to disable)
#INTERVAL=5       # seconds between checks
#STEP_DOWN=3      # max % decrease per tick (increases are instant)

# REQUIRED: the IPMI command that sets fan duty; {DUTY} is replaced with 0-100.
# Discover it with:  sudo gpu-fan-control.sh probe
# Common ASRock Rack formats (8 or 16 duty bytes):
#FAN1_DUTY=20    # CPU fan (FAN1) fixed duty, not driven by the GPU curve
#FAN_SET_CMD="ipmitool raw 0x3a 0x01 {FAN1} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY}"
#FAN_SET_CMD="ipmitool raw 0x3a 0xd6 {FAN1} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY} {DUTY}"
