# /etc/gpu-dropout-recorder.conf — sourced by gpu-dropout-recorder.sh
# All values optional; defaults shown.

# Webhook fired on every incident (Slack incoming-webhook compatible JSON).
# Leave empty to disable alerting (bundles are still written to disk).
#WEBHOOK_URL="https://hooks.slack.com/services/XXX/YYY/ZZZ"

# Expected GPU count. Empty = auto-baseline from nvidia-smi at service start.
# Set explicitly on hosts where the recorder may start while a GPU is already dead.
#EXPECTED_GPUS=5

# Telemetry sampling period for dcgmi dmon, milliseconds (200 = 5Hz).
#SAMPLE_MS=200

# Detector loop period, seconds.
#INTERVAL=5

# Telemetry ring: rotate at this size, 2 generations kept.
#RING_MAX_MB=100

# Keep at most this many incident bundles (oldest pruned).
#MAX_BUNDLES=10

# Where the ring buffer and incident bundles live.
#DATA_DIR=/var/log/gpu-recorder

# Optional BMC/PSU sampling via ipmitool (PSU rails, chassis fans, inlet temp).
# Uses /dev/ipmi0 automatically if present; for IPMI-over-LAN set:
#IPMI_HOST=10.0.0.99
#IPMI_USER=admin
#IPMI_PASS=secret
#IPMI_INTERVAL=30

# ---------------------------------------------------------------------------
# Junction (hotspot) thermal watch
#
# Vendor guidance: a 5090 sustained above 100C junction is due for service.
# Junction is read from the vram-metrics pipeline's /metrics.txt, which already
# applies the full validity gate, so the recorder never spawns its own reader.
# A junction alert NEVER captures a full incident bundle and never disarms
# dropout detection - it takes a light thermal snapshot instead.
#
# IMPORTANT calibration caveat: an existing incident bundle measured core at
# 90C under gpu_burn, and junction runs 10-20C above core, so a routine
# heat-soak will legitimately sit at 100-110C junction. The vendor's "100C =
# service" figure only means something at a DEFINED load and inlet
# temperature. Treat readings taken under the documented pytorch screening
# recipe as evidence; raise JUNCTION_CRIT (or stop the recorder) during
# unrelated stress testing so a deliberate soak does not page anyone.
#JUNCTION_WARN=95
#JUNCTION_CRIT=100
# Set JUNCTION_CRIT=0 to disable the thermal watch entirely.

# Ticks (of INTERVAL seconds) a level must hold before it is reported. A 5090
# moves ~10C/s at load onset, so short excursions are not incidents.
#JUNCTION_SUSTAIN=6

# Recovery: must fall this far below the threshold that fired, for this many
# consecutive ticks, before the episode is closed.
#JUNCTION_CLEAR_HYST=3
#JUNCTION_CLEAR_TICKS=12

# While still critical, re-notify at most this often (seconds).
#JUNCTION_RENOTIFY=3600

# Source of truth for junction/VRAM, and how stale it may be before falling
# back to querying the tool directly.
#METRICS_FILE=/metrics.txt
#JUNCTION_FILE_STALE=60
#JUNCTION_SAMPLE=2
#MAX_THERMAL_SNAPS=20
