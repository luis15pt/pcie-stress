# /etc/gpu-dropout-recorder.conf — sourced by gpu-dropout-recorder.sh
# All values optional; defaults shown.

# Webhook fired on every incident (Slack incoming-webhook compatible JSON).
# Leave empty to disable alerting (bundles are still written to disk).
#WEBHOOK_URL="https://hooks.slack.com/services/XXX/YYY/ZZZ"

# Expected GPU count. Empty = auto-baseline from nvidia-smi at service start.
# Set explicitly on hosts where the recorder may start while a GPU is already dead.
#EXPECTED_GPUS=5

# Telemetry sampling period for dcgmi dmon, milliseconds (200 = 5Hz).
#SAMPLE_MS=200

# Detector loop period, seconds.
#INTERVAL=5

# Telemetry ring: rotate at this size, 2 generations kept.
#RING_MAX_MB=100

# Keep at most this many incident bundles (oldest pruned).
#MAX_BUNDLES=10

# Where the ring buffer and incident bundles live.
#DATA_DIR=/var/log/gpu-recorder

# Optional BMC/PSU sampling via ipmitool (PSU rails, chassis fans, inlet temp).
# Uses /dev/ipmi0 automatically if present; for IPMI-over-LAN set:
#IPMI_HOST=10.0.0.99
#IPMI_USER=admin
#IPMI_PASS=secret
#IPMI_INTERVAL=30
